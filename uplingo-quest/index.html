<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UpLingo Quest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23A8E63D'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-weight='900' font-size='20' text-anchor='middle' fill='%23061a00'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Narrow:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Same brand tokens as UpLingo, plus a deeper "night map" palette for the game view. */
  :root {
    color-scheme: dark;
    --bg: #0B0D12; --bg-2: #10131A;
    --surface: #151821; --surface-2: #1B1F2A; --surface-hi: #232836;
    --border: #232837; --border-hi: #30364A;
    --text: #FFFFFF; --text-2: #9097A8; --text-3: #5A6072;
    --lime: #A8E63D; --lime-ink: #061a00; --lime-soft: rgba(168,230,61,0.14);
    --orange: #F97316; --orange-soft: rgba(249,115,22,0.14);
    --gold: #EAB308; --gold-soft: rgba(234,179,8,0.14);
    --blue: #3B82F6; --blue-soft: rgba(59,130,246,0.14);
    --purple: #8B5CF6; --purple-soft: rgba(139,92,246,0.16);
    --teal: #0FA88A; --teal-soft: rgba(15,168,138,0.14);
    --yellow: #F5E642; --yellow-soft: rgba(245,230,66,0.14);
    --red: #EF4444; --red-soft: rgba(239,68,68,0.14);
    --pink: #EC4899;
    --font-display: 'Archivo', system-ui, sans-serif;
    --font-num: 'Archivo Narrow', 'Archivo', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --r: 18px;
  }
  html, body, #root { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  input, textarea, select { font-family: inherit; color: inherit; }
  ::selection { background: var(--lime); color: var(--lime-ink); }

  /* ---------- Shell ---------- */
  .shell { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; padding-bottom: 92px; }
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; background: rgba(11,13,18,0.86); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; }
  .brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; flex-shrink: 0; }
  .brand .wm { font-family: var(--font-display); font-weight: 900; font-size: 18px; letter-spacing: -0.3px; white-space: nowrap; }
  .brand .wm span { color: var(--lime); }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-family: var(--font-num); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .chip.coins { color: var(--gold); }
  .chip.streak { color: var(--orange); }
  .chip.lvl { color: var(--lime); }
  .role-toggle { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .role-toggle button { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; color: var(--text-2); letter-spacing: 0.3px; }
  .role-toggle button.on { background: var(--lime); color: var(--lime-ink); }

  .tabbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 50;
    width: calc(100% - 24px); max-width: 496px;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: rgba(21,24,33,0.94); backdrop-filter: blur(16px);
    border: 1px solid var(--border-hi); border-radius: 22px; padding: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 16px; color: var(--text-3); font-size: 10.5px; font-weight: 700; letter-spacing: 0.2px; position: relative; }
  .tab .ti { font-size: 20px; line-height: 1; filter: grayscale(0.9) brightness(0.8); transition: filter .15s, transform .15s; }
  .tab.on { color: var(--text); background: var(--surface-hi); }
  .tab.on .ti { filter: none; transform: translateY(-1px) scale(1.08); }
  .tab .dot { position: absolute; top: 5px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--surface); }

  .page { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .h1 { font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: -0.4px; margin: 0; line-height: 1.15; }
  .h2 { font-family: var(--font-display); font-weight: 800; font-size: 16px; margin: 0; letter-spacing: -0.2px; }
  .eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-2); }
  .muted { color: var(--text-2); }
  .tiny { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .num { font-family: var(--font-num); font-weight: 800; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
  .card.glow-lime { box-shadow: inset 0 0 0 1px rgba(168,230,61,0.25), 0 0 40px -18px var(--lime); }
  .card.glow-red { box-shadow: inset 0 0 0 1px rgba(239,68,68,0.3), 0 0 40px -18px var(--red); }
  .card.glow-purple { box-shadow: inset 0 0 0 1px rgba(139,92,246,0.35), 0 0 50px -18px var(--purple); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 14px; font-weight: 800; font-size: 14px; font-family: var(--font-display); letter-spacing: 0.1px; transition: transform .08s, filter .15s, opacity .15s; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--lime); color: var(--lime-ink); }
  .btn.danger { background: var(--red); color: #fff; }
  .btn.ghost { background: var(--surface-2); border: 1px solid var(--border-hi); }
  .btn.gold { background: var(--gold); color: #1a1200; }
  .btn.block { width: 100%; }
  .btn.sm { padding: 8px 12px; font-size: 12.5px; border-radius: 11px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; white-space: nowrap; }
  .b-lime { background: var(--lime-soft); color: var(--lime); }
  .b-orange { background: var(--orange-soft); color: var(--orange); }
  .b-gold { background: var(--gold-soft); color: var(--gold); }
  .b-blue { background: var(--blue-soft); color: #7FB0FF; }
  .b-purple { background: var(--purple-soft); color: #B9A2FF; }
  .b-teal { background: var(--teal-soft); color: #3FD6B5; }
  .b-yellow { background: var(--yellow-soft); color: var(--yellow); }
  .b-red { background: var(--red-soft); color: #FF8A8A; }
  .b-grey { background: var(--surface-hi); color: var(--text-2); }

  /* ---------- Clay icons (soft 3D look without image assets) ---------- */
  .clay {
    --c: var(--lime);
    width: 52px; height: 52px; border-radius: 16px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 26px; position: relative;
    background:
      radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,0.45), rgba(255,255,255,0) 45%),
      radial-gradient(120% 120% at 70% 100%, rgba(0,0,0,0.35), rgba(0,0,0,0) 55%),
      var(--c);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.22), inset 0 2px 0 rgba(255,255,255,0.25), 0 8px 18px -6px var(--c);
  }
  .clay.sm { width: 38px; height: 38px; border-radius: 12px; font-size: 19px; }
  .clay.lg { width: 76px; height: 76px; border-radius: 24px; font-size: 40px; }
  .clay.round { border-radius: 50%; }

  /* ---------- HP bars ---------- */
  .hp { height: 14px; border-radius: 999px; background: var(--surface-hi); overflow: hidden; position: relative; }
  .hp > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .hp > i.pending { background: repeating-linear-gradient(45deg, rgba(255,255,255,0.28) 0 6px, rgba(255,255,255,0.1) 6px 12px); }
  .hp.thin { height: 8px; }
  .hp.big { height: 20px; }

  /* ---------- World map ---------- */
  .map-hero { padding: 16px 16px 0; }
  .map {
    position: relative; margin: 0 0 8px;
    background:
      radial-gradient(60% 40% at 20% 10%, rgba(139,92,246,0.18), transparent 70%),
      radial-gradient(50% 30% at 85% 45%, rgba(15,168,138,0.14), transparent 70%),
      radial-gradient(60% 40% at 30% 85%, rgba(59,130,246,0.14), transparent 70%),
      var(--bg);
    overflow: hidden;
  }
  .map svg.path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .region-banner { position: absolute; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(21,24,33,0.82); border: 1px solid var(--border-hi); backdrop-filter: blur(6px); z-index: 2; }
  .region-banner.locked { opacity: 0.55; }
  .stop { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 3; width: 130px; }
  .island {
    width: 84px; height: 84px; border-radius: 28px; display: grid; place-items: center; font-size: 36px; position: relative;
    background:
      radial-gradient(110% 80% at 30% 18%, rgba(255,255,255,0.5), rgba(255,255,255,0) 45%),
      radial-gradient(120% 120% at 70% 100%, rgba(0,0,0,0.4), rgba(0,0,0,0) 55%),
      var(--c, var(--surface-hi));
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.25), inset 0 3px 0 rgba(255,255,255,0.25), 0 18px 28px -14px var(--c, #000);
    animation: float 5s ease-in-out infinite;
  }
  .island::after { content: ''; position: absolute; bottom: -22px; left: 18%; right: 18%; height: 10px; border-radius: 50%; background: rgba(0,0,0,0.45); filter: blur(6px); z-index: -1; }
  .stop.locked .island { --c: #2A2F3D; filter: saturate(0.2) brightness(0.8); animation: none; }
  .stop.current .island { outline: 3px solid var(--lime); outline-offset: 5px; }
  .stop .lbl { font-size: 11.5px; font-weight: 700; text-align: center; line-height: 1.25; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .stop .state { position: absolute; top: -6px; right: 18px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 900; border: 3px solid var(--bg); }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .pins { position: absolute; display: flex; z-index: 4; transform: translate(-50%, 0); }
  .pin { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #0b0d12; border: 2px solid var(--bg); margin-left: -7px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .pin:first-child { margin-left: 0; }
  .pin.me { width: 34px; height: 34px; font-size: 12px; border-color: var(--lime); box-shadow: 0 0 0 3px rgba(168,230,61,0.3), 0 6px 14px rgba(0,0,0,0.6); }
  .pin.more { background: var(--surface-hi); color: var(--text-2); }

  /* ---------- Sheet / modal ---------- */
  .scrim { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
  .sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border-hi); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 8px 16px 24px; animation: up .22s cubic-bezier(.2,.8,.2,1); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-hi); margin: 4px auto 14px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
  .seg button { padding: 7px 0; border-radius: 9px; font-size: 11.5px; font-weight: 700; color: var(--text-2); }
  .seg button.on-full { background: var(--lime); color: var(--lime-ink); }
  .seg button.on-most { background: var(--gold); color: #1a1200; }
  .seg button.on-half { background: var(--orange); color: #1a0a00; }
  .seg button.on-notfull { background: var(--surface-hi); color: var(--text); }
  .seg:has(button:disabled) { opacity: 0.55; }

  .task { padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Feed ---------- */
  .feed-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .feed-item:last-child { border-bottom: 0; }
  .feed-item.new { animation: flashIn 1.2s ease-out; }
  @keyframes flashIn { 0% { background: rgba(168,230,61,0.18); } 100% { background: transparent; } }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #0b0d12; flex-shrink: 0; }

  /* ---------- Toasts / damage pop ---------- */
  .toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 32px); max-width: 488px; pointer-events: none; }
  .toast { background: var(--surface-hi); border: 1px solid var(--border-hi); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 12px 30px rgba(0,0,0,0.5); animation: up .25s; font-weight: 600; font-size: 13px; }
  .boom { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; pointer-events: none; }
  .boom .n { font-family: var(--font-num); font-weight: 800; font-size: 72px; color: var(--lime); text-shadow: 0 0 30px rgba(168,230,61,0.7), 0 6px 0 #061a00; animation: pop 1.3s cubic-bezier(.2,.9,.2,1) forwards; }
  .boom .n.crit { color: var(--gold); text-shadow: 0 0 30px rgba(234,179,8,0.8), 0 6px 0 #3a2900; }
  .boom .t { position: absolute; margin-top: 120px; max-width: 88%; text-align: center; padding: 6px 12px; border-radius: 10px; background: rgba(11,13,18,0.88); font-family: var(--font-display); font-weight: 900; letter-spacing: 2px; font-size: 14px; text-transform: uppercase; animation: pop 1.3s forwards; }
  @keyframes pop { 0% { transform: scale(0.3); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(0.9); opacity: 0; } }
  .shake { animation: shake .45s; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px) rotate(-1deg); } 40% { transform: translateX(6px) rotate(1deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; }
  .stat .v { font-family: var(--font-num); font-weight: 800; font-size: 26px; line-height: 1.1; }
  .stars { display: flex; gap: 6px; }
  .stars button { font-size: 26px; filter: grayscale(1) brightness(0.6); transition: transform .1s; }
  .stars button.on { filter: none; }
  .stars button:active { transform: scale(1.2); }
  .pill-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .pill-tabs button { padding: 8px 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
  .pill-tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .quiz-opt { width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; }
  .quiz-opt.sel { border-color: var(--lime); background: var(--lime-soft); }
  .quiz-opt.right { border-color: var(--lime); background: var(--lime-soft); }
  .quiz-opt.wrong { border-color: var(--red); background: var(--red-soft); }
  .flash { perspective: 800px; }
  .flash-card { height: 150px; border-radius: 18px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; text-align: center; padding: 16px; background: var(--surface-2); border: 1px solid var(--border-hi); cursor: pointer; }
  .flash-card.back { background: var(--purple-soft); border-color: rgba(139,92,246,0.4); font-size: 16px; font-weight: 600; font-family: var(--font-body); }
  .vs { font-family: var(--font-display); font-weight: 900; font-size: 13px; color: var(--text-3); letter-spacing: 2px; }
  .frame-ring { border-radius: 50%; padding: 4px; }
  input.field, select.field { width: 100%; background: var(--bg-2); border: 1px solid var(--border-hi); border-radius: 12px; padding: 11px 12px; font-size: 14px; outline: none; }
  input.field:focus, select.field:focus { border-color: var(--lime); }
  .rec { width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .lock-overlay { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; }

  /* ---------- Minimal mode: progress and stats, less game decoration ---------- */
  .minimal .island, .minimal .clay { animation: none !important; box-shadow: none !important; background: var(--surface-hi) !important; }
  .minimal .boom { display: none; }
  .minimal .map { background: var(--bg); }

  @media (max-width: 430px) {
    .brand .wm { display: none; }
    .topbar { gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
