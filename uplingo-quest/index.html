<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1120">
<title>UpLingo Quest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F5B83D'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-weight='900' font-size='20' text-anchor='middle' fill='%23241500'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0A1120; --bg-2: #0E1628;
    --surface: #121B2E; --surface-2: #172238; --surface-hi: #1E2B45;
    --border: #22304B; --border-hi: #2E3F60;
    --text: #FFFFFF; --text-2: #93A0BB; --text-3: #5D6A86;
    --gold: #F5B83D; --gold-hi: #FFD978; --gold-lo: #E0951A; --gold-ink: #2A1800; --gold-soft: rgba(245,184,61,0.14);
    --cream: #EBDDB8;
    --blue: #2F80FF; --blue-hi: #5AA2FF; --blue-soft: rgba(47,128,255,0.16);
    --red: #E5383B; --red-hi: #FF5E5E; --red-soft: rgba(229,56,59,0.16);
    --green: #22C55E; --green-soft: rgba(34,197,94,0.15);
    --purple: #8B5CF6; --purple-soft: rgba(139,92,246,0.16);
    --orange: #F97316;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --r: 16px;
  }
  html, body, #root { height: 100%; }
  body { margin: 0; background: #060B16; color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
  input, select { font-family: inherit; color: inherit; }
  ::selection { background: var(--gold); color: var(--gold-ink); }
  svg { display: block; }

  /* ---------- Shell ---------- */
  .shell { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; padding-bottom: 86px; background: var(--bg); box-shadow: 0 0 80px rgba(0,0,0,0.6); }
  .page { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(10,17,32,0.9); backdrop-filter: blur(14px); }
  .topbar .title { flex: 1; text-align: center; font-weight: 800; font-size: 19px; letter-spacing: -0.2px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--text); position: relative; flex-shrink: 0; }
  .icon-btn .dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--bg); }

  .tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 50; width: 100%; max-width: 480px;
    display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
    background: rgba(9,15,28,0.96); backdrop-filter: blur(16px); border-top: 1px solid var(--border); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; color: var(--text-3); font-size: 11px; font-weight: 600; position: relative; text-align: center; }
  .tab.on { color: var(--gold); }
  .tab .dot { position: absolute; top: 0; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--red); }

  .h1 { font-weight: 800; font-size: 22px; letter-spacing: -0.4px; margin: 0; line-height: 1.2; }
  .h2 { font-weight: 800; font-size: 18px; margin: 0; letter-spacing: -0.2px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-2); }
  .muted { color: var(--text-2); }
  .tiny { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .num { font-weight: 800; font-variant-numeric: tabular-nums; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; }
  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  .list > * + * { border-top: 1px solid var(--border); }
  .item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; width: 100%; }
  .item.hl { background: linear-gradient(90deg, rgba(47,128,255,0.22), rgba(47,128,255,0.08)); box-shadow: inset 0 0 0 1px rgba(90,162,255,0.35); }
  .item .t { font-weight: 600; font-size: 14.5px; }
  .item .s { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .item .ico { width: 34px; display: grid; place-items: center; color: var(--cream); flex-shrink: 0; }
  .dmg { color: var(--green); font-weight: 600; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 16px; border-radius: 12px; font-weight: 800; font-size: 15px; transition: transform .08s, filter .15s, opacity .15s; }
  .btn:active { transform: scale(0.97); }
  .btn.gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); color: var(--gold-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 18px -8px var(--gold); }
  .btn.blue { background: linear-gradient(180deg, var(--blue-hi), var(--blue)); color: #fff; }
  .btn.ghost { background: var(--surface-2); border: 1px solid var(--border-hi); }
  .btn.outline-gold { border: 1.5px solid var(--gold); color: var(--gold); padding: 6px 12px; font-size: 13px; border-radius: 10px; }
  .btn.block { width: 100%; }
  .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .b-gold { background: var(--gold-soft); color: var(--gold); }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-blue { background: var(--blue-soft); color: var(--blue-hi); }
  .b-red { background: var(--red-soft); color: var(--red-hi); }
  .b-purple { background: var(--purple-soft); color: #B9A2FF; }
  .b-grey { background: var(--surface-hi); color: var(--text-2); }

  /* Underlined segmented tabs (Current / Completed / Upcoming) */
  .utabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-bottom: 1px solid var(--border); }
  .utabs button { padding: 10px 0; font-weight: 600; font-size: 14px; color: var(--text-2); text-align: center; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .utabs button.on { color: var(--gold); border-color: var(--gold); background: linear-gradient(180deg, transparent, rgba(245,184,61,0.08)); border-radius: 8px 8px 0 0; }

  .bar { height: 8px; border-radius: 999px; background: var(--surface-hi); overflow: hidden; position: relative; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .vsbar { height: 10px; border-radius: 999px; overflow: hidden; display: flex; background: var(--red); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .vsbar > i { background: linear-gradient(90deg, #1E5FD8, var(--blue-hi)); transition: width .8s cubic-bezier(.2,.8,.2,1); position: relative; }
  .vsbar > i::after { content: ''; position: absolute; right: -1px; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 8px #fff; }
  .vsbar > b { flex: 1; background: linear-gradient(90deg, #FF5E5E, #B91C1C); }
  .vsbar.thick { height: 14px; }

  /* Check circles */
  .ck { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .ck.on { background: var(--green); color: #05230f; }
  .ck.off { border: 2px solid var(--text-3); }
  .ck.part { border: 2px solid var(--gold); color: var(--gold); font-size: 9px; font-weight: 800; }

  /* Battle cards */
  .battle-card { position: relative; border-radius: 18px; overflow: hidden; padding: 16px 14px 14px; text-align: center;
    background:
      radial-gradient(70% 90% at 0% 40%, rgba(47,128,255,0.45), transparent 60%),
      radial-gradient(70% 90% at 100% 40%, rgba(229,56,59,0.5), transparent 60%),
      linear-gradient(180deg, #1A1530, #120F1F);
    border: 1px solid rgba(255,255,255,0.08); }
  .battle-card .vs { font-weight: 900; font-size: 30px; font-style: italic; letter-spacing: -1px;
    background: linear-gradient(180deg, #FFE7A0, #F5B83D 50%, #C77B0A); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(245,184,61,0.45)); }
  .side { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 0; }
  .side .n { font-weight: 700; font-size: 13.5px; }
  .side .hp { font-weight: 800; font-size: 16px; }
  .side .hp small { font-size: 11px; font-weight: 700; color: var(--text-2); margin-left: 2px; }

  .crest { filter: drop-shadow(0 8px 14px rgba(0,0,0,0.55)); }

  /* Avatars */
  .av { border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: radial-gradient(circle at 35% 30%, #F7E8CF, #C9A77A); overflow: hidden; line-height: 1; }
  .av-ring { border-radius: 50%; padding: 3px; flex-shrink: 0; position: relative; }
  .av-ring .crown { position: absolute; top: -8px; right: -2px; font-size: 18px; transform: rotate(18deg); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }

  /* ---------- World map ---------- */
  .map-wrap { position: relative; width: 100%; }
  .map-wrap svg.terrain { width: 100%; height: auto; }
  .map-ov { position: absolute; inset: 0; }
  .map-ov > * { position: absolute; }
  .node-hit { width: 44px; height: 34px; transform: translate(-50%, -50%); border-radius: 50%; }
  .pin { transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .pin .face { width: 44px; height: 44px; border-radius: 50%; padding: 3px; background: #fff; box-shadow: 0 6px 14px rgba(0,0,0,0.5); }
  .pin.me .face { background: linear-gradient(135deg, var(--blue-hi), #1E4FD8); width: 50px; height: 50px; }
  .pin .tip { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid #fff; margin-top: -2px; }
  .pin.me .tip { border-top-color: #2A63E6; }
  .pin.dim .face { background: #6B7280; filter: grayscale(0.4); }
  .pin.dim .tip { border-top-color: #6B7280; }
  .map-card { transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    background: rgba(10,17,32,0.82); border: 1px solid rgba(245,184,61,0.55); backdrop-filter: blur(6px); box-shadow: 0 10px 24px rgba(0,0,0,0.45); text-align: left; min-width: 150px; }
  .map-card.lock { border-color: rgba(255,255,255,0.12); color: var(--text-2); }
  .map-card .t { font-weight: 700; font-size: 14px; }
  .map-card .s { font-size: 12px; color: var(--text-2); }
  .lock-badge { transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #D7DCE6;
    background: radial-gradient(circle at 35% 30%, #4B5466, #232A38); border: 2px solid #6B7486; box-shadow: 0 6px 14px rgba(0,0,0,0.6); }
  .map-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: linear-gradient(180deg, rgba(10,17,32,0.95) 60%, rgba(10,17,32,0)); }

  /* Hero (homework header) */
  .hero { position: relative; border-radius: 16px; overflow: hidden; min-height: 112px; padding: 16px; border: 1px solid rgba(255,255,255,0.08);
    background: linear-gradient(100deg, #1B2A55 0%, #2B2E68 45%, #5B3A6E 75%, #A35B4E 100%); }
  .hero .art { position: absolute; right: 0; bottom: 0; height: 100%; width: 62%; pointer-events: none; }
  .hero .content { position: relative; max-width: 66%; }

  /* Banners (battle screen) */
  .arena { position: relative; padding: 4px 0 14px; overflow: hidden;
    background:
      radial-gradient(60% 50% at 50% 30%, rgba(255,140,40,0.35), transparent 70%),
      radial-gradient(40% 40% at 15% 20%, rgba(47,128,255,0.25), transparent 70%),
      radial-gradient(40% 40% at 85% 20%, rgba(229,56,59,0.3), transparent 70%),
      linear-gradient(180deg, #1A1222, #0A1120); }
  .ember { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #FFB347; box-shadow: 0 0 6px #FF8C1A; animation: rise linear infinite; opacity: 0; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-180px); opacity: 0; } }

  /* ---------- Sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
  .sheet { width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border-hi); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 8px 16px 26px; animation: up .22s cubic-bezier(.2,.8,.2,1); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-hi); margin: 4px auto 14px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
  .seg button { padding: 10px 0; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--text-2); text-align: center; }
  .seg button.on-full { background: var(--green); color: #05230f; }
  .seg button.on-most { background: var(--gold); color: var(--gold-ink); }
  .seg button.on-half { background: var(--orange); color: #1a0a00; }
  .seg button.on-notfull { background: var(--surface-hi); color: var(--text); }

  .pill-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .pill-tabs button { padding: 8px 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; font-size: 13px; color: var(--text-2); white-space: nowrap; }
  .pill-tabs button.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
  .quiz-opt { width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; }
  .quiz-opt.sel, .quiz-opt.right { border-color: var(--green); background: var(--green-soft); }
  .quiz-opt.wrong { border-color: var(--red); background: var(--red-soft); }
  .flash-card { height: 150px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 22px; text-align: center; padding: 16px; background: var(--surface-2); border: 1px solid var(--border-hi); cursor: pointer; }
  .flash-card.back { background: var(--purple-soft); border-color: rgba(139,92,246,0.4); font-size: 16px; font-weight: 600; }
  input.field { width: 100%; background: var(--bg-2); border: 1px solid var(--border-hi); border-radius: 12px; padding: 11px 12px; font-size: 14px; outline: none; margin-top: 4px; }
  input.field:focus { border-color: var(--gold); }
  .stars { display: flex; gap: 6px; }
  .stars button { font-size: 26px; filter: grayscale(1) brightness(0.55); }
  .stars button.on { filter: none; }
  .switch { width: 48px; height: 28px; border-radius: 999px; background: var(--surface-hi); position: relative; transition: background .15s; flex-shrink: 0; }
  .switch.on { background: var(--gold); }
  .switch span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on span { left: 23px; }
  .rec { width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; display: inline-block; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* Stat tiles + streak + achievements */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 8px; text-align: center; }
  .tile .k { font-size: 12.5px; color: var(--text-2); }
  .tile .v { font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
  .week { display: flex; gap: 10px; justify-content: flex-end; }
  .week .d { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text-2); }
  .week .c { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--text-3); display: grid; place-items: center; }
  .week .c.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ach { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ach.locked { opacity: 0.45; }
  .ach .n { font-weight: 700; font-size: 12.5px; }
  .ach .d { font-size: 11px; color: var(--text-2); line-height: 1.3; }

  /* Feed */
  .feed-item.new { animation: flashIn 1.4s ease-out; }
  @keyframes flashIn { 0% { background: rgba(245,184,61,0.2); } 100% { background: transparent; } }

  /* Toasts + damage pop */
  .toasts { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 32px); max-width: 448px; pointer-events: none; }
  .toast { background: var(--surface-hi); border: 1px solid var(--border-hi); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 12px 30px rgba(0,0,0,0.5); animation: up .25s; font-weight: 600; font-size: 13px; }
  .boom { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; pointer-events: none; }
  .boom .n { font-weight: 900; font-size: 76px; color: var(--green); text-shadow: 0 0 30px rgba(34,197,94,0.6), 0 6px 0 #05230f; animation: pop 1.3s cubic-bezier(.2,.9,.2,1) forwards; }
  .boom .n.crit { color: var(--gold); text-shadow: 0 0 30px rgba(245,184,61,0.8), 0 6px 0 #3a2400; }
  .boom .t { position: absolute; margin-top: 128px; max-width: 86%; text-align: center; padding: 7px 14px; border-radius: 10px; background: rgba(10,17,32,0.9); font-weight: 800; letter-spacing: 1px; font-size: 13px; text-transform: uppercase; animation: pop 1.3s forwards; }
  @keyframes pop { 0% { transform: scale(0.3); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(0.9); opacity: 0; } }
  .float { animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* Minimal mode: progress and stats, less decoration */
  .minimal .float, .minimal .ember { animation: none !important; display: none; }
  .minimal .boom { display: none; }
  .minimal .battle-card, .minimal .arena { background: var(--surface) !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="game.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
